<!doctype html>
<html lang="bn">
<head><script src="/sdk/takabazar-game-sdk.js"></script><script src="/sdk/takabazar-auto-bridge.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkyRush Bet Total Admin</title>
<style>
:root{--bg:#08101a;--card:#101b28;--line:#203246;--text:#edf5ff;--muted:#8da2b8;--green:#23d489}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans Bengali",sans-serif}
.wrap{max-width:760px;margin:auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:21px;margin:0}.live{color:var(--green);font-weight:800}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.card small{display:block;color:var(--muted);font-size:11px}
.card b{display:block;font-size:28px;margin-top:7px}
.hero{grid-column:1/-1;padding:21px}
.hero b{font-size:40px;color:var(--green)}
.status{margin-top:12px;color:var(--muted);font-size:11px;text-align:center}
@media(max-width:560px){.cards{grid-template-columns:1fr}.hero{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>SkyRush — Bet Monitor</h1>
    <div class="live">● LIVE</div>
  </div>

  <div class="cards">
    <div class="card hero">
      <small>আজ মোট Bet</small>
      <b id="todayTotal">৳0.00</b>
    </div>

    <div class="card">
      <small>আজ Bet Count</small>
      <b id="todayCount">0</b>
    </div>

    <div class="card">
      <small>Server Session Total</small>
      <b id="sessionTotal">৳0.00</b>
    </div>

    <div class="card">
      <small>Session Bet Count</small>
      <b id="sessionCount">0</b>
    </div>

    <div class="card">
      <small>Date</small>
      <b id="date">—</b>
    </div>
  </div>

  <div class="status" id="status">Connecting…</div>
</div>

<script>
const API_BASE = window.SKYRUSH_API_BASE || "http://localhost:3010";
const money=v=>"৳"+Number(v||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});

function draw(d){
  document.getElementById("todayTotal").textContent=money(d.todayTotal);
  document.getElementById("todayCount").textContent=Number(d.todayCount||0).toLocaleString();
  document.getElementById("sessionTotal").textContent=money(d.sessionTotal);
  document.getElementById("sessionCount").textContent=Number(d.sessionCount||0).toLocaleString();
  document.getElementById("date").textContent=d.date||"—";
}

fetch(API_BASE+"/api/skyrush/bet-summary")
  .then(r=>r.json())
  .then(d=>{draw(d);document.getElementById("status").textContent="Live monitor connected";})
  .catch(()=>{document.getElementById("status").textContent="Monitor server unavailable";});

const es=new EventSource(API_BASE+"/api/skyrush/bet-live");
es.onmessage=e=>{
  try{
    draw(JSON.parse(e.data));
    document.getElementById("status").textContent="Updated: "+new Date().toLocaleTimeString();
  }catch(_){}
};
es.onerror=()=>{
  document.getElementById("status").textContent="Reconnecting…";
};
</script>
</body>
</html>
