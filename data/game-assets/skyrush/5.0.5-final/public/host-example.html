<!doctype html>
<html lang="bn">
<head><script src="/sdk/takabazar-game-sdk.js"></script><script src="/sdk/takabazar-auto-bridge.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkyRush Site Wallet Test</title>
<style>
body{margin:0;background:#09111b;color:#fff;font-family:Arial,sans-serif}
.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#101923}
.balance{font-weight:900;color:#24db88;font-size:20px}
iframe{display:block;width:100%;height:calc(100vh - 56px);border:0}
</style>
</head>
<body>
<div class="top">
  <b>HOST SITE</b>
  <div>Site Balance: <span class="balance" id="siteBalance">1000.00</span> BDT</div>
</div>

<iframe id="skyrushGame" src="./index.html"></iframe>
<script src="./skyrush-host-wallet.js"></script>
<script>
// This page simulates the HOST SITE balance.
// The game itself has no balance.
let siteBalance=1000;

function draw(){
  document.getElementById("siteBalance").textContent=siteBalance.toFixed(2);
}
draw();

SkyRushHostWallet.mount({
  iframeId:"skyrushGame",
  currency:"BDT",

  getBalance:async()=>siteBalance,

  debit:async(amount,meta)=>{
    if(amount<=0 || siteBalance<amount){
      return {success:false,balance:siteBalance,error:"insufficient_balance"};
    }
    siteBalance=Math.round((siteBalance-amount)*100)/100;
    draw();
    return {success:true,balance:siteBalance};
  },

  credit:async(amount,meta)=>{
    siteBalance=Math.round((siteBalance+amount)*100)/100;
    draw();
    return {success:true,balance:siteBalance};
  }
});
</script>
</body>
</html>
